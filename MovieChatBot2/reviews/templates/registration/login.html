{% extends 'base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; margin-bottom: 30px;">🔐 로그인</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-common" style="width: 100%; margin-top: 20px;">로그인</button>
    </form>
    <div style="text-align: center; margin-top: 20px; font-size: 0.9em; color: #666;">
        아직 계정이 없으신가요? <a href="{% url 'signup' %}" style="color: #007bff;">회원가입</a>
    </div>
</div>
{% endblock %}
