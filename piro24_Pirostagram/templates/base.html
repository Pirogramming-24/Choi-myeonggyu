<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirostagram</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; background-color: #fafafa; }
        a { text-decoration: none; color: inherit; }
    </style>
</head>
<body>
    
    <nav style="background: white; border-bottom: 1px solid #dbdbdb; padding: 0 20px; height: 60px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center;">
        <div style="width: 100%; max-width: 975px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;">
            
            <div style="flex: 1; display: flex; justify-content: flex-start;">
                <a href="{% url 'posts:post_list' %}" style="font-size: 24px; font-weight: bold; font-family: cursive;">
                    Pirostagram
                </a>
            </div>

            <div style="display: flex; justify-content: center; width: 268px;">
                <form action="{% url 'posts:post_list' %}" method="GET" style="position: relative; width: 100%;">
                    <span style="position: absolute; left: 10px; top: 9px; color: #8e8e8e; font-size: 14px;">🔍</span>
                    <input type="text" name="q" placeholder="검색" value="{{ q|default:'' }}" 
                           style="background: #efefef; border: none; padding: 10px 10px 10px 35px; border-radius: 8px; outline: none; width: 100%; box-sizing: border-box; font-size: 14px;">
                </form>
            </div>

            <div style="flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 20px;">
                {% if user.is_authenticated %}
                    <a href="{% url 'posts:post_list' %}" title="홈">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="black"><path d="M22 10.154v9.646c0 1.21-.99 2.2-2.2 2.2H4.2C2.99 22 2 21.01 2 19.8V10.154c0-.68.32-1.31.86-1.72L12 1.3l9.14 7.134c.54.41.86 1.04.86 1.72z"/></svg>
                    </a>
                    
                    <a href="{% url 'posts:post_create' %}" title="새 게시물">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                    </a>

                    <div onclick="alert('새로운 알림이 없습니다.')" style="cursor: pointer;" title="알림">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    </div>

                    <a href="{% url 'users:logout' %}" style="font-size: 14px; font-weight: bold; min-width: 60px; text-align: right;">
                        로그아웃
                    </a>
                {% else %}
                    <a href="{% url 'users:login' %}" style="background-color: #0095f6; color: white; padding: 6px 15px; border-radius: 4px; font-weight: bold; font-size: 14px;">로그인</a>
                {% endif %}
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}
</body>
</html>
