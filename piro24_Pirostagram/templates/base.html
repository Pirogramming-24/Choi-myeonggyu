<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirostagram</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #fafafa; }
        nav { background: white; border-bottom: 1px solid #dbdbdb; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: bold; font-size: 1.5rem; text-decoration: none; color: black; }
        .container { max-width: 935px; margin: 20px auto; padding: 0 20px; }
        .btn { padding: 5px 10px; text-decoration: none; color: #0095f6; font-weight: bold; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'posts:post_list' %}" class="logo">Pirostagram</a>
        
        <form action="{% url 'users:search' %}" method="GET" style="display: flex;">
            <input type="text" name="q" placeholder="검색" style="padding: 5px; border: 1px solid #dbdbdb; border-radius: 3px;">
        </form>

        <div>
            {% if user.is_authenticated %}
                <a href="{% url 'users:profile' user.username %}" style="text-decoration: none; font-weight: bold; margin-right: 10px; color: black;">
                    {{ user.username }}님 어서오세요!
                </a>
                <a href="{% url 'posts:post_create' %}" class="btn">➕ 글쓰기</a> 
                <a href="{% url 'users:logout' %}" class="btn">로그아웃</a>
            {% else %}
                <a href="{% url 'users:login' %}" class="btn">로그인</a>
                <a href="{% url 'users:signup' %}" class="btn">회원가입</a>
            {% endif %}
        </div>
        <a href="{% url 'users:notifications' %}" class="btn">🔔</a>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
