{% extends 'base.html' %}

{% block content %}
<div style="max-width: 350px; margin: 50px auto; background: white; padding: 20px; border: 1px solid #dbdbdb; text-align: center;">
    <h1 class="logo">Pirostagram</h1>
    <h3 style="color: #8e8e8e;">친구들의 사진과 동영상을 보려면 가입하세요.</h3>
    
    <form method="POST" action="" enctype="multipart/form-data">
        {% csrf_token %}
        <div style="text-align: left; margin-bottom: 10px;">
            {{ form.as_p }}
        </div>
        <button type="submit" style="width: 100%; padding: 5px; background-color: #0095f6; color: white; border: none; border-radius: 4px; cursor: pointer;">가입하기</button>
    </form>
</div>
{% endblock %}
