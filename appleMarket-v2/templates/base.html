{% load static %}
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{%static 'posts/css/style.css'%}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    {% block head %}


    {% endblock %}
</head>

<body>
    <main>
        <a href="/" id='logo' style='text-decoration: none; color: green;'>
            <h1>🍎 사과 마켓 🍎</h1>
        </a>
        <footer style="display: flex; justify-content: center; align-items: center;">
            
            <a href="/" class="mx-2">
                <button type="button" class="btn btn-secondary">메인으로</button>
            </a>

            <a href="{% url 'users:create' %}" class="mx-2">
                <button type="button" class="btn btn-info">사용자 추가</button>
            </a>
            <a href="{% url 'users:list' %}" class="mx-2">
                <button type="button" class="btn btn-warning">사용자 관리</button>
            </a>
        </footer>
        <hr>
        {% block content %}


        {% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>

</html>
